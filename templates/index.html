<!DOCTYPE html>
<html>

<head>

<title>AI Voice Expense Tracker</title>

<link rel="stylesheet" href="/static/style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<h1>AI Voice Expense Tracker</h1>

<button onclick="startVoice()">🎤 Speak Expense</button>

<p id="voiceText"></p>

<h2>Expense List</h2>

<table id="expenseTable">

<tr>
<th>Amount</th>
<th>Category</th>
<th>Description</th>
<th>Date</th>
<th>Action</th>
</tr>

</table>

<h2>Expense Chart</h2>

<canvas id="expenseChart" width="400" height="200"></canvas>

<script src="/static/script.js"></script>

</body>

</html>
